name: Auto Create PR on Feature Branch

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'update/**'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing PR
        id: check_pr
        run: |
          existing_pr=$(curl -s -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open" \
            | jq '.[0].number // empty')
          echo "existing_pr=$existing_pr" >> $GITHUB_OUTPUT
          echo "Found existing PR: $existing_pr"

      - name: Create Pull Request
        if: steps.check_pr.outputs.existing_pr == ''
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d '{
              "title": "[Auto PR] Changes from ${{ github.ref_name }}",
              "body": "## Automated Pull Request\n\n**Branch:** `${{ github.ref_name }}`\n**Author:** ${{ github.actor }}\n**Commit:** ${{ github.sha }}\n\n### Review Required\nThis PR was automatically created when changes were pushed to this feature branch.\nAn admin must review and approve before merging to main.\n\n---\n*Auto-generated by CI/CD pipeline*",
              "head": "${{ github.ref_name }}",
              "base": "main"
            }'

      - name: Comment on existing PR
        if: steps.check_pr.outputs.existing_pr != ''
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.check_pr.outputs.existing_pr }}/comments" \
            -d "{\"body\": \"New commit pushed: ${{ github.sha }} by ${{ github.actor }}\"}"