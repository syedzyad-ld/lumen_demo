name: Auto Create PR on Feature Branch

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'update/**'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for existing PR
        id: check_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr=$(gh pr list --head "${{ github.ref_name }}" --base main --state open --json number -q '.[0].number')
          echo "existing_pr=$existing_pr" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_pr.outputs.existing_pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "[Auto PR] Changes from ${{ github.ref_name }}" \
            --body "## Automated Pull Request

          **Branch:** \`${{ github.ref_name }}\`
          **Author:** ${{ github.actor }}
          **Commit:** ${{ github.sha }}

          ### Review Required
          This PR was automatically created when changes were pushed to this feature branch.
          An admin must review and approve before merging to main.

          ---
          *Auto-generated by CI/CD pipeline*" \
            --base main \
            --head "${{ github.ref_name }}" \
            --label "auto-pr,needs-review" || echo "PR may already exist"

      - name: Update existing PR
        if: steps.check_pr.outputs.existing_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ steps.check_pr.outputs.existing_pr }} \
            --body "New commit pushed: ${{ github.sha }} by ${{ github.actor }}"